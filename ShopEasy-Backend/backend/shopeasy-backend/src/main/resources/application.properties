spring.application.name=shopeasy
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/shopeasy_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Change this secret before production. It must be at least 32 bytes for HS256.
app.jwt.secret=ShopEasyDevelopmentSecretKeyChangeThisBeforeProduction123456
app.jwt.expiration-ms=86400000

server.error.include-message=always
